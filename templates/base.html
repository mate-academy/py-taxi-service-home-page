{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Taxi Service{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div style="display: flex;">
        <div style="width: 200px;">
            {% block sidebar %}
                {% include "includes/sidebar.html" %}
            {% endblock %}
        </div>
        <div style="flex-grow: 1; padding: 20px;">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
